<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>BeesCAD — инженерное 3D-моделирование</title>
    <script>
      // Тема до первой отрисовки (избегает вспышки): тёмная по умолчанию.
      (function () {
        var t = 'dark';
        try {
          var s = localStorage.getItem('beescad.theme') || localStorage.getItem('psbees.theme');
          if (s === 'light' || s === 'dark') t = s;
        } catch (e) { /* приватный режим и т.п. */ }
        document.documentElement.dataset.theme = t;
      })();
      // Качество отрисовки до первой отрисовки: на слабых устройствах тяжёлые
      // эффекты (backdrop-filter, декоративные анимации) не включаем вообще,
      // а 3D-холст сразу рисуется в пониженном разрешении. Логика та же, что в
      // src/perf.ts (оценки должны совпадать), уточняется после кадров.
      (function () {
        var root = document.documentElement, level = 'high';
        try {
          var saved = localStorage.getItem('beescad.perf') || localStorage.getItem('psbees.perf');
          if (saved === 'high' || saved === 'balanced' || saved === 'low') level = saved;
          else {
            var n = navigator, cores = n.hardwareConcurrency || 4, mem = n.deviceMemory || 0;
            var dpr = window.devicePixelRatio || 1, score = 0;
            if (cores <= 2) score -= 2; else if (cores <= 4) score -= 1; else if (cores >= 8) score += 1;
            if (mem) { if (mem <= 2) score -= 2; else if (mem <= 4) score -= 1; else if (mem >= 8) score += 1; }
            if (dpr >= 3) score -= 2; else if (dpr >= 2) score -= 1;
            try { if (window.matchMedia('(pointer: coarse)').matches) score -= 1; } catch (e2) { /* нет matchMedia */ }
            level = score <= -2 ? 'low' : (score <= 0 ? 'balanced' : 'high');
          }
        } catch (e) { /* приватный режим: остаёмся на высоком */ }
        root.dataset.perf = level;
        root.dataset.perfEffects = level === 'low' ? 'off' : 'on';
      })();
    </script>
    <style>
      html, body, #root { height: 100%; margin: 0; }
      body { background: var(--page, #0f1115); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
