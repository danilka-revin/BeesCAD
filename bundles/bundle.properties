# Strings for the co-op multiplayer features (see scripts/main.js).
# Keys are global, so they are prefixed with "mp." (co-op module).

mp.pause.all = Pause for everyone
mp.resume.all = Resume for everyone

mp.paused.by = [accent]{0}[] paused the game. Anyone can unpause it: use the pause menu button or the /mp-pause command.
mp.unpaused.by = [accent]{0}[] unpaused the game.

mp.onlyhost = Only the host can launch cores to other sectors, abandon sectors and unlock research.
mp.hostonly.pause = Only the host can pause the game in this lobby.

mp.mapview = Planet map opened in view-only mode: only the host can launch cores between sectors.
mp.researchview = Research opened in view-only mode: only the host can unlock technologies.

mp.cmd.help = [accent]Co-op commands:[] /mp-pause — pause or resume the game for everyone; /mp-pause on|off — force a state; /mp-status — co-op module diagnostics.
