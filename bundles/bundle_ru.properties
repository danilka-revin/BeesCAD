# Русские строки для кооп-режима (см. scripts/main.js).

# Строки блоков.
block.water-well-400-water-well.name = Водяная скважина
block.water-well-400-water-well.description = Крупная скважина в стиле гидронасоса: подаёт до 400 ед. воды в секунду при полном питании. Расход энергии — 3000 ед./с.
block.water-well-400-water-well.details = Дизайн ванильного гидронасоса Mindustry, растянутый с 2×2 до 5×5 плавным фильтром (без пиксельного увеличения) и перекрашенный в тёмно-серый: серый корпус, синие кольца и четыре вращающихся модуля ротора.

block.water-well-400-mega-dome.name = Мега-купол
block.water-well-400-mega-dome.description = Огромный сверхкупол: разгоняет все постройки в радиусе 10 клеток на +400 %. Требует воду, кремний и титан.
block.water-well-400-mega-dome.details = Дизайн ванильного сверхкупола Mindustry, растянутый с 3×3 до 4×4 плавным фильтром и затемнённый, но крупнее и сильнее: +400 % скорости, радиус 10 клеток. Пока работает, съедает 30 ед. воды/с, 5 кремния/с, 2 титана/с и 35 ед. энергии/с. Цвет свечения — baseColor блока.

mp.pause.all = Пауза для всех
mp.resume.all = Продолжить у всех

mp.paused.by = [accent]{0}[] поставил игру на паузу. Снять её может любой игрок: кнопка в меню паузы или команда /mp-pause.
mp.unpaused.by = [accent]{0}[] снял паузу.

mp.onlyhost = Запускать ядро в другие секторы, отказываться от сектора и открывать технологии может только хост.
mp.hostonly.pause = В этой игре паузу ставит только хост.

mp.mapview = Карта планеты открыта в режиме просмотра: летать между секторами может только хост.
mp.researchview = Исследования открыты в режиме просмотра: открывать технологии может только хост.

mp.cmd.help = [accent]Кооп-команды:[] /mp-pause — поставить или снять паузу для всех; /mp-pause on|off — включить или выключить принудительно; /mp-status — диагностика кооп-модуля.

mp.t5.disabled = сборка T5-юнитов: без изменений
mp.t5.faster = сборка T5-юнитов: ускорена
