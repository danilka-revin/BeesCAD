# Русские строки для кооп-режима (см. scripts/main.js).

mp.pause.all = Пауза для всех
mp.resume.all = Продолжить у всех

mp.paused.by = [accent]{0}[] поставил игру на паузу. Снять её может любой игрок: кнопка в меню паузы или команда /mp-pause.
mp.unpaused.by = [accent]{0}[] снял паузу.

mp.onlyhost = Запускать ядро в другие секторы, отказываться от сектора и открывать технологии может только хост.
mp.hostonly.pause = В этой игре паузу ставит только хост.

mp.mapview = Карта планеты открыта в режиме просмотра: летать между секторами может только хост.
mp.researchview = Исследования открыты в режиме просмотра: открывать технологии может только хост.

mp.cmd.help = [accent]Кооп-команды:[] /mp-pause — поставить или снять паузу для всех; /mp-pause on|off — включить или выключить принудительно; /mp-status — диагностика кооп-модуля.
